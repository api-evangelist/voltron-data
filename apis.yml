name: Voltron Data
description: >-
  Voltron Data is a Mountain View-based data infrastructure company (founded 2021) behind
  Theseus, a GPU-accelerated, composable distributed SQL query engine for petabyte-scale
  analytics and AI pipelines, distributed embedded through partners rather than as a
  self-serve public API. The company is a major steward of the open-source composable data
  stack — Apache Arrow, Ibis, Substrait, Arrow Flight SQL, and ADBC — acquired Claypot AI in
  January 2024, and is backed by Battery Ventures, GV, Lightspeed Venture Partners, and
  Walden Catalyst, with an Accenture investment in 2025. As of 2026-07-21 the company
  website (voltrondata.com) is unreachable — the domain is registered but its DNS zone is
  lame-delegated — leaving the GitHub organization as the live public surface; no public
  API, SDK packages, or developer portal are published.
